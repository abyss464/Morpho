# morphod configuration. Copy to ./morphod.toml (or pass --config PATH).
# Every key is optional; omitted keys keep the built-in defaults shown here.
# Precedence: command-line flags > MORPHOD_* environment > this file > defaults.
#
# Relative paths resolve against the process working directory, so morphod is
# normally launched from the repository root.

# Holds working.db and the content-addressed media store.
data_dir = "data"

# Where `morphod export` and POST /api/releases/export write bundles.
releases_dir = "data/releases"

# Admin API and admin UI listen address.
bind = "127.0.0.1:8787"

# Built admin UI; served as a single-page app when the directory exists.
admin_ui_dist = "admin-ui/dist"

[store]
# Read-only connections in the pool (README Part 4 says 4-8).
read_pool_size = 6
# Pending write operations before callers start waiting.
write_queue_depth = 256
# Change-bus capacity; slow subscribers lag rather than block the writer.
change_bus_capacity = 1024

[reconcile]
# Periodic full-pass interval. Correctness never depends on change events.
full_pass_interval_secs = 60
# Window used to absorb bursts of edits before running a scoped pass.
coalesce_window_ms = 250

# ---------------------------------------------------------------------------
# Content sources
#
# An unset source is DISABLED, and disabled is treated exactly like waived: the
# engine derives no job for it, and the next fallback in the chain fires
# immediately instead of waiting out eight retries. Nothing is ever faked to
# stand in for a source that is not configured.
#
# The keyless sources below have nothing to unset, so they are never disabled —
# only reachable or not, which is a retry rather than an absence. A checkout
# with no accounts of any kind still produces real definitions, sentences and
# pictures (admin-api.md ruling #18); only the URLs are configurable, and only
# so an operator can point them at a mirror.
# ---------------------------------------------------------------------------
[sources]
# Free Dictionary API. Definitions, IPA, and the per-sense usage sentences that
# become `freedict` example candidates out of the very same response.
freedict_url = "https://api.dictionaryapi.dev/api/v2/entries/en"

# Wiktionary MediaWiki API, used for etymology.
wiktionary_url = "https://en.wiktionary.org/w/api.php"

# Wikimedia Commons: keyless images, with per-file licence and author recorded
# on every candidate.
wikimedia_url = "https://commons.wikimedia.org/w/api.php"

# English Wikipedia REST summary. The second image strategy, used only when the
# Commons File-namespace search comes up short: abstract and common words own no
# file named after them but do own an article whose lead image depicts them.
# The picture is still a Commons asset and its licence is still read from
# Commons, so nothing ships without terms.
wikipedia_url = "https://en.wikipedia.org/api/rest_v1/page/summary"

# Openverse: keyless images, filtered to commercially reusable and modifiable
# licences. Anonymous quota is low, so a 429 parks the whole lane.
#
# A word that both keyless libraries came up empty for is asked again on looser
# terms before anything is generated: Openverse without the licence filter (every
# CC licence, NonCommercial and NoDerivatives included, each recorded verbatim on
# the candidate), then both libraries with a query widened by the primary gloss's
# content words. Each retry writes a completion mark of its own —
# openverse_relaxed, wikimedia_widened, openverse_widened — so it runs once per
# word and never overwrites the record of the first pass. Those candidates score
# below any first-pass hit, so a strict picture found later still wins the slot.
openverse_url = "https://api.openverse.org/v1/images/"

# Tatoeba: keyless English example sentences. Each sentence carries its own
# licence, recorded in the candidate's source_ref alongside its id.
tatoeba_url = "https://tatoeba.org/en/api_v0/search"

# Wikimedia answers 403 without a real User-Agent naming the tool and a way to
# make contact, so this is a functional requirement. Keep the address current.
user_agent = "Morpho/0.1 vocabulary content builder (+https://github.com/morpho)"

# Per-request HTTP timeout.
http_timeout_secs = 20

# WNdb data files (data.noun, index.noun, {noun,verb,adj,adv}.exc, ...). Enables
# three things at once: the WordNet gloss fallback for definitions, the semantic
# clustering stage of the learning plan, and the lemmatizer's exception lists.
# Unset -> the first two are skipped rather than approximated, and the lemmatizer
# falls back to its compiled-in irregular table.
#
# The .exc files change how definitions lemmatize, so they change the recorded
# `lemmatizer_ver` too: turning this key on or off re-extracts every definition
# candidate once, by design.
# wordnet_dir = "data/wordnet/dict"

# Exam-corpus JSONL, one object per line:
#   {"word": "benevolent", "sentence": "The benevolent donor funded the library."}
#   {"word": "adapt", "sentence": "Species adapt to a changing climate.", "source": "2019-T1"}
# `word` is matched case-insensitively and may appear inflected in the sentence;
# `source` is optional provenance. Highlight offsets are computed after
# canonicalization, and a sentence that does not contain its own target word is
# dropped rather than stored with a guessed range.
# Unset -> freedict and tatoeba are the only example sources, which is enough
# for a word to become shippable.
# corpus_path = "data/exam-corpus.jsonl"

# Stock photo providers. A provider without a key is never queried; the keyless
# libraries above carry on regardless, so an unkeyed install still gets real
# photographs. SDXL only becomes the live path once EVERY enabled library has
# been asked and come back empty; when SDXL is absent too, words honestly
# report `missing_image`.
# Environment overrides these: UNSPLASH_ACCESS_KEY, PEXELS_API_KEY,
# PIXABAY_API_KEY.
# unsplash_access_key = ""
# pexels_api_key = ""
# pixabay_api_key = ""

# Local ComfyUI for the SDXL image fallback. Environment: COMFYUI_URL.
# comfyui_url = "http://127.0.0.1:8188"

# The CLIP scoring sidecar (adapters/clip). Unset — the default — means image
# selection has no semantic term at all and ranks on the quality prior alone,
# which is exactly what it did before the sidecar existed. Set, it becomes the
# dominant signal: a picture that matches the word's own sentence beats a sharper
# picture of the wrong thing.
#
# It is a separate process because it needs a GPU this one does not have. Run it
# under a venv with a working accelerator build of torch, and point this at it —
# `http://host.docker.internal:30013` from the container, `http://127.0.0.1:30013`
# natively. See docs/contracts/clip-service.md. Environment: MORPHO_CLIP_URL.
# clip_url = "http://127.0.0.1:30013"

# The generator the codex adapter shells out to, for the last link in the image
# chain. The adapter reads the same MORPHO_CODEX_BIN override, so a machine where
# this binary does not exist has the source *disabled* rather than dead-lettering
# every word — the same treatment a stock library with no API key gets.
# codex_bin = "codex"

# ---------------------------------------------------------------------------
# Python adapters (docs/contracts/adapter-protocol.md)
# ---------------------------------------------------------------------------
[adapters]
# Directory the adapter commands run from; adapters/<name> lives under it.
# Unset (the default) means "find the repository root by walking up from this
# file, then from the working directory, looking for an adapters/ directory" —
# which is what makes morphod reach the adapters regardless of where it was
# started. A relative value here resolves against this file's directory.
# Environment: MORPHOD_ADAPTERS_ROOT.
# adapters_root = "."
# Argument vector template; every {adapter} becomes tts / morfessor / sdxl.
# Override it if you vendored the virtualenvs, e.g.
#   command = ["python", "-m", "morpho_{adapter}"]
command = ["uv", "run", "--project", "adapters/{adapter}", "{adapter}-adapter"]
# Morfessor needs a few hundred distinct words before its ad-hoc trainer
# produces anything useful (protocol ruling #4). Smaller pending sets wait...
morfessor_batch = 300
# ...but not forever: after this long, the batch goes anyway and the words that
# come back unsegmented are recorded as a zero-result fetch.
morfessor_batch_max_age_secs = 600

# ---------------------------------------------------------------------------
# Text-to-speech
#
# Every field here feeds the TTS content address. Changing any of them does not
# rewrite existing audio: it produces different input hashes, so new rows appear
# and the orphans become GC-eligible.
# ---------------------------------------------------------------------------
[tts]
voice = "en-US-AriaNeural"
rate = "+0%"
pitch = "+0Hz"
volume = "+0%"
# The dictation quiz needs clean phonemes, so the word track is richer than the
# prose tracks (README Part 5 budget).
word_bitrate_kbps = 48
text_bitrate_kbps = 32
engine = "edge-tts"
engine_ver = "7"

# ---------------------------------------------------------------------------
# Images
#
# This section is about the LAST link in the image chain only. Every library is
# still asked first, still asked again on looser terms, and a real photograph
# still outranks anything generated — none of that moves. What lives here is how
# a word none of them could answer for gets its picture.
# ---------------------------------------------------------------------------
[images]
# Scene mode. Off: a word that reaches generation is prompted for the bare
# concept ("a clear photographic scene depicting the concept of 'abandon': ...").
# On: it is prompted with its own selected slot-1 sentence, so the picture shows
# the moment the card's sentence describes and the card becomes one scene read
# two ways. Only words that HAVE a slot-1 sentence take this path; the rest keep
# the bare-concept prompt.
#
# Turning it on points a local GPU at every word the libraries left behind, so it
# is an explicit decision. Environment: MORPHO_SCENE_MODE=1 (0 turns it back off).
scene_mode = false

# Version tag of the scene-prompt template. It rides in the candidate's
# source_ref — "sdxl:<seed> (scene scene/1)" — and in the job subject, so bumping
# it is how you ask for every scene image to be generated again under a changed
# template. Nothing is cleared: the old candidates stay, carrying the version
# that produced them, and the slot only moves if the selector prefers the new one.
scene_prompt_ver = "scene/1"

# Generation settings, sent to the sdxl adapter only while scene_mode is on. The
# defaults are SDXL-Turbo's: four steps, no guidance. That is what makes a bulk
# pass over thousands of words finish in an evening rather than a week. Point
# these at your own workflow if your ComfyUI runs the base model instead.
sdxl_steps = 4
sdxl_cfg = 1.0
sdxl_workflow = "sdxl_turbo_v1"

# The CLIP model the sidecar is expected to be serving. It rides in
# clip_scores.model_ver next to the algorithm version, so a different model
# writes different rows rather than making the old ones wrong — and the executor
# refuses a sidecar reporting anything else, because one lexicon scored two ways
# is exactly what that column exists to prevent. Environment: MORPHO_CLIP_MODEL.
clip_model = "ViT-B-32/laion2b_s34b_b79k"

# The codex source: the last link in the image chain, and the only one that fires
# on a picture being *inapt* rather than absent. Every library, both second
# passes and local SDXL generation come first; a word reaches here when its best
# picture still scores below codex_threshold against its own sentence, or when it
# has no scored picture at all.
#
# Off by default, and doubly gated — it also needs the adapter on disk and its
# generator binary on PATH. Turning it on spends somebody's hosted quota, so it
# is an explicit decision. Environment: MORPHO_CODEX_ENABLED=1.
codex_enabled = false

# Version tag of the codex prompt template; same mechanism as scene_prompt_ver.
# Environment: MORPHO_CODEX_PROMPT_VER.
codex_prompt_ver = "codex/1"

# Raw CLIP cosine below which a word's best picture is worth replacing. The
# default sits in the middle of the band the live lexicon occupies: a good match
# lands near 0.28 and the bottom decile falls under 0.20.
# Environment: MORPHO_CODEX_THRESHOLD.
codex_threshold = 0.22

# Most codex jobs one derivation may ask for. The queue is derived rather than
# stored, so the words a pass does not ask for cost nothing and come back next
# pass — this is what keeps a first run from putting six thousand generation
# requests in front of somebody's rate limit.
# Environment: MORPHO_CODEX_BATCH.
codex_batch = 8

# ---------------------------------------------------------------------------
# Learning plan
# ---------------------------------------------------------------------------
[plan]
# Group size window (README Part 1: 15-20 words per group).
group_min = 15
group_max = 20

# Environment overrides:
#   MORPHOD_CONFIG         path to this file
#   MORPHOD_DATA_DIR       overrides data_dir
#   MORPHOD_RELEASES_DIR   overrides releases_dir
#   MORPHOD_BIND           overrides bind
#   MORPHOD_ADMIN_UI_DIST  overrides admin_ui_dist
#   MORPHOD_ADAPTERS_ROOT  overrides adapters.adapters_root
#   MORPHO_WORDNET_DIR     overrides sources.wordnet_dir
#   MORPHO_CORPUS_PATH     overrides sources.corpus_path
#   MORPHO_SCENE_MODE      overrides images.scene_mode (1/true/on, 0/false/off)
#   MORPHO_CLIP_URL        overrides sources.clip_url
#   MORPHO_CLIP_MODEL      overrides images.clip_model
#   MORPHO_CODEX_ENABLED   overrides images.codex_enabled (1/true/on, 0/false/off)
#   MORPHO_CODEX_PROMPT_VER / MORPHO_CODEX_THRESHOLD / MORPHO_CODEX_BATCH
#   MORPHO_CODEX_BIN       overrides sources.codex_bin (the adapter reads it too)
#   UNSPLASH_ACCESS_KEY / PEXELS_API_KEY / PIXABAY_API_KEY / COMFYUI_URL
#   RUST_LOG               overrides --log
