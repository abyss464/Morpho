[project]
name = "morpho-clip-adapter"
version = "0.1.0"
description = "Morpho CLIP adapter: image-text aptness scoring via subprocess or HTTP sidecar"
readme = "README.md"
requires-python = ">=3.12"
# The subprocess adapter (clip-adapter) runs in its own uv-managed venv and
# needs the model backend installed.  The sidecar (clip-sidecar) can still be
# run under an external venv that already holds a GPU-enabled torch — setting
# PYTHONPATH and pointing at the source tree, as documented in
# docs/contracts/clip-service.md.
#
# The project's own venv (the one Docker builds) resolves torch and torchvision
# from PyTorch's CPU-only index, pinned in uv.lock, so the image stays small
# and accelerator-free.  A GPU host runs the sidecar under its own venv
# instead, where torch auto-detects CUDA/ROCm.
dependencies = [
    "morpho-adapter-common",
    "torch>=2.0",
    "open-clip-torch>=2.20",
    "pillow>=10.4,<12",
]

[project.scripts]
clip-adapter = "morpho_clip.adapter:main"
clip-sidecar = "morpho_clip.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morpho_clip"]

[tool.uv.sources]
morpho-adapter-common = { path = "../common", editable = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
