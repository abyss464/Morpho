[project]
name = "morpho-adapter-common"
version = "0.1.0"
description = "Shared stdin/stdout JSON envelope and error taxonomy for Morpho adapters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morpho_adapter_common"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
