[project]
name = "morpho-tts-adapter"
version = "0.1.0"
description = "Morpho TTS adapter: edge-tts synthesis transcoded to mono Ogg Opus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "morpho-adapter-common",
    "edge-tts>=7.0,<8",
]

[project.scripts]
tts-adapter = "morpho_tts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morpho_tts"]

[tool.uv.sources]
morpho-adapter-common = { path = "../common", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
